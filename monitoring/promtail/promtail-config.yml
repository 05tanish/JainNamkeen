server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /tmp/positions.yaml

scrape_configs:

  # ── App logs (Winston JSON — written by the backend to /app/logs) ─────────
  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: app-logs
          app: ecommerce-backend
          __path__: /var/log/app/*.log

    pipeline_stages:
      # Parse JSON emitted by Winston
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
            module: module
            requestId: requestId
            method: method
            url: url
            status: status
            duration: duration

      # Promote useful fields as Loki labels (keep cardinality low)
      - labels:
          level:
          service:
          module:
          method:
          status:

      # Use Winston's own timestamp instead of ingest time
      - timestamp:
          source: timestamp
          format: RFC3339

      - output:
          source: message
